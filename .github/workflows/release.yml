name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

env:
  PROJECT: SqlDatabaseDump.csproj
  APP_NAME: SqlDatabaseDump

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish "$PROJECT"
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:Version=${{ steps.get_version.outputs.version }}

      - name: Archive (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $archive = "$env:APP_NAME-${{ steps.get_version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Archive (Unix)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          archive="$APP_NAME-${{ steps.get_version.outputs.version }}-${{ matrix.rid }}.tar.gz"
          tar -czf "$archive" -C publish .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
